
name: Build Yaqeen Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q yaqeen-merged-for-github.zip -d project

          if [ ! -f project/package.json ]; then
            PACKAGE_FILE=$(find project -maxdepth 5 -name package.json -type f -print -quit)

            if [ -z "$PACKAGE_FILE" ]; then
              echo "package.json not found in ZIP"
              exit 1
            fi

            PROJECT_ROOT=$(dirname "$PACKAGE_FILE")
            shopt -s dotglob
            mv "$PROJECT_ROOT"/* project/
          fi

          test -f project/package.json
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: project
        run: npm install

      - name: Build web
        working-directory: project
        run: npm run build:web

      - name: Sync Android
        working-directory: project
        run: npx cap sync android

      
      - name: Generate debug keystore
        run: |
          mkdir -p build-tools
          keytool -genkeypair -v \
            -keystore build-tools/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      

            
      - name: Build APK
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yaqeen-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
